services:
  postgres:
    image: postgres:16-alpine
    container_name: iess_turnos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-iess_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iess_secure_pwd2026}
      POSTGRES_DB: ${DB_NAME:-iess_turnos_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iess_internal_net
    ports:
      # En desarrollo exponemos al localhost en puerto alternativo para evitar conflicto con postgres local
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-iess_user} -d ${DB_NAME:-iess_turnos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iess_turnos_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-iess_user}:${DB_PASSWORD:-iess_secure_pwd2026}@postgres:5432/${DB_NAME:-iess_turnos_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_at_least_32_chars_long_2026}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600s}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"IESS - Turnos de Salud <alexandertoapanta05@gmail.com>"}
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iess_internal_net

networks:
  iess_internal_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local

